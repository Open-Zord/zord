# Configuração de allowed imports por camada para validação de dependências

[services]
allowed = [
  "internal/application/domain",
  "internal/repositories",
  "internal/application/providers",
  "internal/application/context",
  "pkg/apperror"
]

[domain]
allowed = [
  "internal/application/domain",
  # baserepo (port de persistência) mora em providers/ ao lado de
  # baseservice; o domain importa o contrato pra declarar Repository.
  "internal/application/providers/baserepo"
]

[repositories]
allowed = [
  "internal/application/domain",
  "internal/repositories",
  # adapter importa o port que implementa (baserepo.Repository/Tx) — hexagonal.
  "internal/application/providers/baserepo",
  "github.com/fatih/structs",
  "github.com/jmoiron/sqlx",
  "github.com/go-sql-driver/mysql"
]

[providers]
allowed = [
  "internal/application/providers"
]

[context]
allowed = [] # Apenas stdlib 