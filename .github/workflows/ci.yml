name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Arquivos não formatados (rode gofmt -w):"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

      # Dogfood do gate de arquitetura: gera um projeto efêmero a partir do
      # runtime embarcado e roda o gate nele (module path limpo, como no uso
      # real). Cobre embed + projectgen + go mod tidy + as 19 validações.
      - name: architecture gate
        run: make arch-analyse

  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Testes de integração do runtime embarcado (//go:build integration) contra
      # um MySQL real. Eles criam o próprio schema e pulam sem ZORD_IT_DSN.
      - name: integration tests
        env:
          ZORD_IT_DSN: root:root@tcp(127.0.0.1:3306)/test?parseTime=true
        run: go test -tags integration ./...
