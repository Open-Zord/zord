# GoReleaser — empacota o CLI `zord`. Módulo único, Go puro (CGO off), então a
# matriz cross-compila limpo. Dispara no push de tag vX.Y.Z (ver
# .github/workflows/release.yml). Valide local com `goreleaser check`.
version: 2

project_name: zord

before:
  hooks:
    - go mod tidy

builds:
  - id: zord
    main: ./cmd/zord
    binary: zord
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: zord
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # Windows ganha .zip em vez de .tar.gz.
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: Open-Zord
    name: zord
